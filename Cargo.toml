[package]
name = "snag"
version = "2.2.0"
edition = "2024"
description = "A private video and audio downloader for your desktop"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "Snag"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
resvg = { version = "0.50", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rfd = "0.17"
arboard = { version = "3", default-features = false }
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
